name: win-probe
on:
  workflow_dispatch:
    inputs:
      release_run:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: inst
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
      - name: Install
        shell: pwsh
        run: |
          $i = Get-ChildItem inst -Recurse -Filter *.exe | Select-Object -First 1
          Start-Process $i.FullName -ArgumentList '/S' -Wait
      - name: Plain launch
        shell: pwsh
        run: |
          $env:RUST_LOG = 'info'
          $p = Start-Process "$env:LOCALAPPDATA\txtCaster\txtCaster.exe" -PassThru
          Start-Sleep 25
          "plain exited=$($p.HasExited) code=$($p.ExitCode) title=[$($p.MainWindowTitle)]"
          Get-ChildItem "$env:LOCALAPPDATA\txtcaster-data" -ErrorAction SilentlyContinue | Select-Object Name | Format-Table | Out-String
          Get-Process txtCaster -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
      - name: Redirected launch
        shell: pwsh
        run: |
          $env:RUST_LOG = 'info'
          $p = Start-Process "$env:LOCALAPPDATA\txtCaster\txtCaster.exe" -PassThru -RedirectStandardError "$PWD\e.log" -RedirectStandardOutput "$PWD\o.log"
          Start-Sleep 25
          "redirect exited=$($p.HasExited) code=$($p.ExitCode) title=[$($p.MainWindowTitle)]"
          Get-Process | Where-Object { $_.Name -match 'txtcaster|msedgewebview2' } | Select-Object Name,Id | Format-Table | Out-String
      - name: Redirected launch survives the next step
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.Name -match 'txtcaster' } | Select-Object Name,Id,MainWindowTitle | Format-Table | Out-String
          Get-Process txtCaster -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          "stderr bytes $((Get-Item e.log).Length)"
          Get-Content e.log -TotalCount 12 | ForEach-Object { $_.Substring(0, [Math]::Min(170, $_.Length)) }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-4)} -MaxEvents 4 -ErrorAction SilentlyContinue | Format-List TimeCreated,ProviderName,Message | Out-String -Width 170
      - name: Through cmd
        shell: pwsh
        run: |
          $env:RUST_LOG = 'info'
          Start-Process cmd -ArgumentList '/c',"`"$env:LOCALAPPDATA\txtCaster\txtCaster.exe`" 2> `"$PWD\c.log`"" -WindowStyle Hidden
          Start-Sleep 25
          Get-Process | Where-Object { $_.Name -match 'txtcaster' } | Select-Object Name,Id,MainWindowTitle | Format-Table | Out-String
          Get-Process txtCaster -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          "cmd stderr bytes $((Get-Item c.log).Length)"
          Get-Content c.log -TotalCount 6 | ForEach-Object { $_.Substring(0, [Math]::Min(170, $_.Length)) }
