name: nobus-probe
on:
  workflow_dispatch:
    inputs:
      packages_run:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb-rpm
          path: pkg
          run-id: ${{ inputs.packages_run }}
          github-token: ${{ github.token }}
      - name: Probe the runner host the way the release check does
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -q ./pkg/deb/*.deb xvfb xdotool gdb dbus-x11 >/dev/null 2>&1 || true
          env | grep -E 'DBUS|XDG_RUNTIME' || true
          dpkg -l xdg-desktop-portal 2>/dev/null | tail -n 1 | cut -c1-60
          busctl --user list --no-pager 2>&1 | head -8 | cut -c1-90
          (timeout 50 dbus-monitor --session > mon.log 2>&1 &)
          sleep 1
          S=$(date +%s)
          RUST_LOG=info timeout 45 xvfb-run -a txtcaster > run.log 2>&1 &
          for at in 8 18; do
            while [ $(( $(date +%s) - S )) -lt $at ]; do sleep 1; done
            A=$(pgrep -x txtcaster | head -1)
            echo "=== main thread at ${at}s pid ${A:-none}"
            [ -n "$A" ] && sudo gdb -p "$A" -batch -ex 'thread 1' -ex 'bt 30' 2>/dev/null | grep -E '^#' | cut -c1-120
          done
          wait || true
          echo "--- log"; grep -vE '^$' run.log | cut -c1-130 | head -8
          echo "--- bus calls"; grep -E 'member=|error' mon.log | grep -vE 'NameOwnerChanged|NameAcquired|NameLost|interface=org.freedesktop.DBus; member=(Hello|AddMatch|RemoveMatch)' | cut -c1-170 | head -40
