name: nobus-probe
on:
  workflow_dispatch:
    inputs:
      packages_run:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb-rpm
          path: pkg
          run-id: ${{ inputs.packages_run }}
          github-token: ${{ github.token }}
      - name: Control with a plain GTK application
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -q ./pkg/deb/*.deb xvfb python3-gi gir1.2-gtk-3.0 >/dev/null 2>&1 || true
          cat > gtkapp.py <<'PY'
          import time, gi
          gi.require_version("Gtk", "3.0")
          from gi.repository import Gtk
          a = Gtk.Application(application_id="test.plain.gtk")
          t = time.time()
          a.register(None)
          print(f"plain GtkApplication register {time.time() - t:.1f}s")
          PY
          probe() {
            /usr/bin/python3 -I -c 'import time;print(time.strftime("%X"))'
            for n in 1 2; do xvfb-run -a /usr/bin/python3 gtkapp.py 2>&1 | grep register; done
            S=$(date +%s); RUST_LOG=info timeout 45 xvfb-run -a txtcaster > run.log 2>&1 &
            for _ in $(seq 45); do grep -q ffmpeg\ source run.log 2>/dev/null && break; sleep 1; done
            echo "$1: txtCaster setup after $(( $(date +%s) - S ))s"
            pkill -x txtcaster; wait || true
          }
          systemctl --user stop xdg-desktop-portal xdg-document-portal xdg-permission-store 2>/dev/null || true
          probe 'portal activatable, cannot start'
          probe 'second launch in the same session'
          systemctl --user mask xdg-desktop-portal 2>&1 | cut -c1-80 || true
          probe 'portal unit masked'
