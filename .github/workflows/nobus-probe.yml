name: nobus-probe
on:
  workflow_dispatch:
    inputs:
      packages_run:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb-rpm
          path: pkg
          run-id: ${{ inputs.packages_run }}
          github-token: ${{ github.token }}
      - name: Probe the runner host the way the release check does
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -q ./pkg/deb/*.deb xvfb xdotool gdb >/dev/null 2>&1
          env | grep -E 'DBUS|XDG_RUNTIME' || true
          ls -la "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}" 2>&1 | head -8
          ls /usr/bin/dbus-launch 2>&1 || true
          RUST_LOG=info timeout 45 xvfb-run -a txtcaster > run.log 2>&1 &
          sleep 30
          A=$(pgrep -x txtcaster | head -1)
          echo "pid ${A:-none}"
          echo "--- log"; tail -n 8 run.log | cut -c1-180
          if [ -n "$A" ]; then
            sudo gdb -p "$A" -batch -ex 'thread apply all bt 16' 2>/dev/null | grep -E '^(Thread|#)' | grep -vE 'syscall_cancel|futex_wait' | cut -c1-110 | head -50
          fi
          wait || true
          echo "--- final log"; wc -l run.log; tail -n 4 run.log | cut -c1-160
      - name: Same with a private bus
        run: |
          RUST_LOG=info dbus-run-session -- timeout 25 xvfb-run -a txtcaster > run2.log 2>&1 || true
          wc -l run2.log; head -n 3 run2.log | cut -c1-140
