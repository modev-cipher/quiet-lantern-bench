name: linux-release
on:
  workflow_dispatch:
    inputs:
      engines:
        description: Also build the CPU and CUDA engines
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Packages on the 22.04 baseline
        env:
          TXTCASTER_UPDATE_PUBKEY: ${{ vars.TXTCASTER_UPDATE_PUBKEY }}
          RELEASE_BUILD_ROOT: ${{ runner.temp }}/rb
        run: scripts/release/build_linux_container.sh app
      - name: Lite engine on the baseline
        env:
          RELEASE_BUILD_ROOT: ${{ runner.temp }}/rb
        run: |
          scripts/release/build_linux_container.sh engine lite
          sudo apt-get update && sudo apt-get install -y "$(ls ${{ runner.temp }}/rb/target/release/bundle/deb/*.deb)" xvfb dbus-daemon
          test ! -e /usr/lib/txtCaster/txtcaster-engine
          /usr/lib/txtCaster/ffmpeg/ffmpeg -hide_banner -version | head -n 1
          python3 scripts/smoke_test.py engine/dist-lite/txtcaster-engine/txtcaster-engine --reader-only
          RUST_LOG=info dbus-run-session -- timeout 40 xvfb-run -a txtcaster > run.log 2>&1 || [ $? = 124 ]
          tail -n 20 run.log
          grep -E 'ffmpeg source=bundled' run.log
          test -f /usr/lib/txtCaster/pulse/libpulse-LGPL.txt
          ls /usr/lib/x86_64-linux-gnu/pulseaudio/
          if ls /usr/lib/x86_64-linux-gnu/pulseaudio/libpulsecommon-1[56].*.so >/dev/null 2>&1; then
            grep -F 'audio uses the bundled libpulse 17.0' run.log
          else
            ! grep -F 'bundled libpulse' run.log
          fi
      - name: The AppImage rejects color fonts
        run: |
          image=$(ls ${{ runner.temp }}/rb/target/release/bundle/appimage/*.AppImage)
          chmod +x "$image"
          (cd "$(mktemp -d)" && "$image" --appimage-extract AppRun >/dev/null && grep FONTCONFIG_FILE squashfs-root/AppRun && "$image" --appimage-extract usr/share/txtcaster/fonts.conf >/dev/null && grep -c rejectfont squashfs-root/usr/share/txtcaster/fonts.conf)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage
          retention-days: 7
          path: ${{ runner.temp }}/rb/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-deb-rpm
          retention-days: 7
          path: |
            ${{ runner.temp }}/rb/target/release/bundle/deb/*.deb
            ${{ runner.temp }}/rb/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
  engines:
    if: ${{ inputs.engines }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda13]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          df -h / | tail -1
      - name: Build the engine on the 22.04 baseline
        env:
          RELEASE_BUILD_ROOT: ${{ runner.temp }}/rb
        run: scripts/release/build_linux_container.sh engine ${{ matrix.variant }}
      - name: Smoke and size
        run: |
          dist=engine/dist-${{ matrix.variant }}; [ -d "$dist" ] || dist=engine/dist
          du -sh "$dist/txtcaster-engine"
          python3 scripts/smoke_test.py "$dist/txtcaster-engine/txtcaster-engine"
          ldd "$dist/txtcaster-engine/txtcaster-engine" | head -5
          df -h / | tail -1
      - name: Pack
        env:
          RELEASE_BUILD_ROOT: ${{ runner.temp }}/rb
        run: |
          scripts/release/build_linux_container.sh signer
          signer=$(find "$RELEASE_BUILD_ROOT" -type f -name update_sign -perm -u+x | head -1)
          dist=engine/dist-${{ matrix.variant }}; [ -d "$dist" ] || dist=engine/dist
          mkdir -p out-engine
          "$signer" engine-pack --dir "$dist/txtcaster-engine" --out-prefix "out-engine/txtcaster-engine-0.1.0-linux-x86_64-${{ matrix.variant }}"
          ls -la out-engine | cut -c1-110
          sha256sum out-engine/*.tar.zst.* > "out-engine/${{ matrix.variant }}.hashes.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-engine-${{ matrix.variant }}
          retention-days: 7
          path: out-engine/*
          if-no-files-found: error
