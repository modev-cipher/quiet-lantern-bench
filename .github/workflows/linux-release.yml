name: linux-release
on:
  workflow_dispatch:
    inputs:
      engines:
        description: Also build the CPU and CUDA engines
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Packages on the 22.04 baseline
        env:
          TXTCASTER_UPDATE_PUBKEY: ${{ vars.TXTCASTER_UPDATE_PUBKEY }}
          RELEASE_BUILD_ROOT: ${{ runner.temp }}/rb
        run: scripts/release/build_linux_container.sh app
      - name: Lite engine on the baseline
        env:
          RELEASE_BUILD_ROOT: ${{ runner.temp }}/rb
        run: |
          scripts/release/build_linux_container.sh engine lite
          sudo apt-get update && sudo apt-get install -y "$(ls ${{ runner.temp }}/rb/target/release/bundle/deb/*.deb)" xvfb dbus-daemon
          test ! -e /usr/lib/txtCaster/txtcaster-engine
          /usr/lib/txtCaster/ffmpeg/ffmpeg -hide_banner -version | head -n 1
          python3 scripts/smoke_test.py engine/dist-lite/txtcaster-engine/txtcaster-engine --reader-only
          RUST_LOG=info dbus-run-session -- timeout 40 xvfb-run -a txtcaster > run.log 2>&1 || [ $? = 124 ]
          tail -n 20 run.log
          grep -E 'ffmpeg source=bundled' run.log
          test -f /usr/lib/txtCaster/pulse/libpulse-LGPL.txt
          ls /usr/lib/x86_64-linux-gnu/pulseaudio/
          if ls /usr/lib/x86_64-linux-gnu/pulseaudio/libpulsecommon-1[56].*.so >/dev/null 2>&1; then
            grep -F 'audio uses the bundled libpulse 17.0' run.log
          else
            ! grep -F 'bundled libpulse' run.log
          fi
      - name: The AppImage rejects color fonts
        run: |
          image=$(ls ${{ runner.temp }}/rb/target/release/bundle/appimage/*.AppImage)
          chmod +x "$image"
          (cd "$(mktemp -d)" && "$image" --appimage-extract AppRun >/dev/null && grep FONTCONFIG_FILE squashfs-root/AppRun && "$image" --appimage-extract usr/share/txtcaster/fonts.conf >/dev/null && grep -c rejectfont squashfs-root/usr/share/txtcaster/fonts.conf)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage
          retention-days: 7
          path: ${{ runner.temp }}/rb/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-deb-rpm
          retention-days: 7
          path: |
            ${{ runner.temp }}/rb/target/release/bundle/deb/*.deb
            ${{ runner.temp }}/rb/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
  engines:
    if: ${{ inputs.engines }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            backend: vulkan
          - variant: cuda13
            backend: cuda
          - variant: lite
            backend: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          df -h / | tail -1
      - name: Build the engine on the 22.04 baseline
        env:
          RELEASE_BUILD_ROOT: ${{ runner.temp }}/rb
        run: scripts/release/build_linux_container.sh engine ${{ matrix.variant }}
      - name: Smoke and size
        run: |
          dist=engine/dist-${{ matrix.variant }}; [ -d "$dist" ] || dist=engine/dist
          du -sh "$dist/txtcaster-engine"
          if [ "${{ matrix.variant }}" = lite ]; then
            python3 scripts/smoke_test.py "$dist/txtcaster-engine/txtcaster-engine" --reader-only
          else
            python3 scripts/smoke_test.py "$dist/txtcaster-engine/txtcaster-engine" --expect-backend ${{ matrix.backend }}
          fi
          ldd "$dist/txtcaster-engine/txtcaster-engine" | head -5
          df -h / | tail -1
      - name: Test model
        if: ${{ matrix.variant != 'lite' }}
        run: |
          curl -fsSL -o "${{ runner.temp }}/stories260K.gguf" https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
          echo "270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  ${{ runner.temp }}/stories260K.gguf" | sha256sum -c -
      - name: Generation on a Vulkan GPU (lavapipe)
        if: ${{ matrix.variant == 'cpu' }}
        env:
          GGML_VK_VISIBLE_DEVICES: "0"
          GGML_VK_DISABLE_F16: "1"
          GGML_VK_DISABLE_COOPMAT: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          python3 scripts/smoke_test.py engine/dist/txtcaster-engine/txtcaster-engine --expect-backend vulkan --require-gpu --gguf "${{ runner.temp }}/stories260K.gguf" | tee gpu.log
          grep -E "generation on .*\(vulkan\)" gpu.log
      - name: Generation on the CPU without a GPU driver
        if: ${{ matrix.variant != 'lite' }}
        env:
          VK_DRIVER_FILES: /nonexistent.json
          VK_ICD_FILENAMES: /nonexistent.json
        run: |
          dist=engine/dist-${{ matrix.variant }}; [ -d "$dist" ] || dist=engine/dist
          python3 scripts/smoke_test.py "$dist/txtcaster-engine/txtcaster-engine" --expect-backend ${{ matrix.backend }} --gguf "${{ runner.temp }}/stories260K.gguf" | tee cpu.log
          grep -F "gpu_offload=False devices=[]" cpu.log
          grep -F "generation on the CPU (cpu)" cpu.log
      - name: Pack
        env:
          RELEASE_BUILD_ROOT: ${{ runner.temp }}/rb
        run: |
          scripts/release/build_linux_container.sh signer
          signer=$(find "$RELEASE_BUILD_ROOT" -type f -name update_sign -perm -u+x | head -1)
          dist=engine/dist-${{ matrix.variant }}; [ -d "$dist" ] || dist=engine/dist
          mkdir -p out-engine
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' engine/txtcaster_engine/__init__.py)"
          base="out-engine/txtcaster-engine-$version-linux-x86_64-${{ matrix.variant }}"
          "$signer" engine-pack --dir "$dist/txtcaster-engine" --out-prefix "$base"
          ls -la out-engine | cut -c1-110
          {
            sha256sum "$base".tar.zst.* | sed 's#out-engine/##; s/ \*/  /'
            echo "whole  $(cat "$base".tar.zst.* | sha256sum | cut -d' ' -f1)"
            stat -c '%n %s' "$base".tar.zst.* | sed 's#out-engine/##'
          } > "$base.hashes.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-engine-${{ matrix.variant }}
          retention-days: 7
          path: out-engine/*
          if-no-files-found: error
