name: linux-release
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Packages on the 22.04 baseline
        env:
          TXTCASTER_UPDATE_PUBKEY: ${{ vars.TXTCASTER_UPDATE_PUBKEY }}
          RELEASE_BUILD_ROOT: ${{ runner.temp }}/rb
        run: scripts/release/build_linux_container.sh app
      - name: Lite engine on the baseline
        env:
          RELEASE_BUILD_ROOT: ${{ runner.temp }}/rb
        run: |
          scripts/release/build_linux_container.sh engine lite
          sudo apt-get update && sudo apt-get install -y "$(ls ${{ runner.temp }}/rb/target/release/bundle/deb/*.deb)" xvfb
          test ! -e /usr/lib/txtCaster/txtcaster-engine
          /usr/lib/txtCaster/ffmpeg/ffmpeg -hide_banner -version | head -n 1
          python3 scripts/smoke_test.py engine/dist-lite/txtcaster-engine/txtcaster-engine --reader-only
          RUST_LOG=info timeout 25 xvfb-run -a txtcaster > run.log 2>&1 || [ $? = 124 ]
          tail -n 20 run.log
          grep -E 'ffmpeg source=bundled' run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages
          retention-days: 7
          path: |
            ${{ runner.temp }}/rb/target/release/bundle/deb/*.deb
            ${{ runner.temp }}/rb/target/release/bundle/rpm/*.rpm
            ${{ runner.temp }}/rb/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
